name: CI

# Docs-only changes skip CI: nothing they touch is built or tested here.
# Keep this list in sync with the one in release.yml.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'Experiments/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Package.swift needs the Swift 6.2 toolchain (Xcode 26 or later).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Check translations
        run: scripts/check-localizations.sh
      - name: Build app bundle
        run: scripts/build-app.sh release
